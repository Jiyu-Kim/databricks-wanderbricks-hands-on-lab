[project]
site_name = "Wanderbricks 핸즈온 랩"
site_url = "https://jiyu-kim.github.io/databricks-wanderbricks-hands-on-lab/kor/"
repo_url = "https://github.com/Jiyu-Kim/databricks-wanderbricks-hands-on-lab"
docs_dir = "docs/kor"
extra_css = ["assets/stylesheets/extra.css"]
site_dir = "site/kor"
nav = [
  { "Wanderbricks Hands-on Lab" = "index.md" },
  { "소개" = ["00-introduction/index.md", { "사전 준비" = "00-introduction/prerequisites.md" }, { "Wanderbricks 시나리오 & 페르소나" = "00-introduction/scenario.md" }] },
  { "1) Lakeflow 파이프라인 구축" = ["01-lakeflow-pipeline/index.md", { "1.1) Bronze: 원천 데이터 수집" = "01-lakeflow-pipeline/1-1-bronze.md" }, { "1.2) Silver·Gold: 정제와 고객 360" = "01-lakeflow-pipeline/1-2-silver-gold.md" }, { "1.3) 파이프라인 실행과 결과 확인" = "01-lakeflow-pipeline/1-3-run.md" }, { "1.4) (Optional) Genie Code와 Visual Data Prep" = "01-lakeflow-pipeline/1-4-optional-genie-code-vdp.md" }] },
  { "2) AI/BI 대시보드 구축" = ["02-aibi-dashboard/index.md", { "2.1) 데이터셋과 탭 만들기" = "02-aibi-dashboard/2-1-dataset.md" }, { "2.2) 핵심 위젯 직접 만들기" = "02-aibi-dashboard/2-2-widgets.md" }, { "2.3) Genie Code로 한 번에 만들기" = "02-aibi-dashboard/2-3-genie-code.md" }] },
  { "3) Unity Catalog Semantics 구축" = ["03-uc-semantics/index.md", { "3.1) Metric View: 예약" = "03-uc-semantics/3-1-mv-bookings.md" }, { "3.2) Metric View: 리뷰" = "03-uc-semantics/3-2-mv-reviews.md" }, { "3.3) Domain 만들고 연결하기" = "03-uc-semantics/3-3-domain.md" }] },
  { "4) Genie Agent 구축과 고도화" = ["04-genie-agent/index.md", { "4.1) Genie Agent 만들기" = "04-genie-agent/4-1-create.md" }, { "4.2) Monitoring: 현업 피드백 받기" = "04-genie-agent/4-2-monitoring.md" }, { "4.3) Benchmark: 정답률 평가하기" = "04-genie-agent/4-3-benchmark.md" }, { "4.4) 개선: Metric View 수정과 Page 생성" = "04-genie-agent/4-4-improve.md" }, { "4.5) (Optional) Volumes로 문서까지 분석하기" = "04-genie-agent/4-5-volumes.md" }] },
  { "5) Genie One으로 질문하기" = ["05-genie-one/index.md"] },
  { "마무리" = "99-wrap-up/index.md" },
]

[project.theme]
logo = "assets/images/databricks-logo.png"
favicon = "assets/images/databricks-logo.png"
language = "ko"
features = [
  "content.code.copy",
  "content.code.annotate",
  "navigation.footer",
  "navigation.indexes",
  "navigation.path",
  "navigation.top",
  "navigation.tracking",
  "search.highlight",
  "toc.follow",
]

[project.theme.palette]
scheme = "default"
primary = "red"
accent = "deep orange"

[project.extra]
alternate = [
  { name = "한국어", link = "/databricks-wanderbricks-hands-on-lab/kor/", lang = "ko" },
  { name = "English", link = "/databricks-wanderbricks-hands-on-lab/eng/", lang = "en" },
]

[project.markdown_extensions]
admonition = {}
attr_list = {}
md_in_html = {}
tables = {}
toc.permalink = true
pymdownx.details = {}
pymdownx.superfences.custom_fences = [
  { name = "mermaid", class = "mermaid", format = "pymdownx.superfences.fence_code_format" },
]
pymdownx.highlight.anchor_linenums = true
pymdownx.inlinehilite = {}
pymdownx.snippets.base_path = ["."]
pymdownx.snippets.check_paths = true
pymdownx.tabbed.alternate_style = true
pymdownx.tasklist.custom_checkbox = true
pymdownx.keys = {}
pymdownx.emoji.emoji_index = "zensical.extensions.emoji.twemoji"
pymdownx.emoji.emoji_generator = "zensical.extensions.emoji.to_svg"
