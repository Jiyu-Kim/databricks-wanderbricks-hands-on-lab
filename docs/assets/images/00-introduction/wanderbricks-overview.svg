<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 700" width="1600" height="700" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#1B3139" flood-opacity="0.12"/>
    </filter>
    <linearGradient id="globe" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#D6EFF8"/>
      <stop offset="1" stop-color="#B6E3F4"/>
    </linearGradient>
    <clipPath id="globeClip"><circle cx="800" cy="330" r="230"/></clipPath>
  </defs>

  <!-- background -->
  <rect width="1600" height="700" fill="#F9F7F4"/>
  <circle cx="160" cy="120" r="70" fill="#FFDFBF" opacity="0.6"/>
  <circle cx="1460" cy="580" r="90" fill="#FFD5DC" opacity="0.5"/>
  <rect x="0" y="600" width="1600" height="100" fill="#EFEAE3"/>

  <!-- globe -->
  <g filter="url(#sh)">
    <circle cx="800" cy="330" r="230" fill="url(#globe)"/>
  </g>
  <g clip-path="url(#globeClip)" fill="#8FD3C2" opacity="0.9">
    <path d="M610 230c40-40 110-50 150-20 30 22 10 60-30 70-50 12-60 50-100 40-40-10-55-55-20-90z"/>
    <path d="M800 170c50-20 120-5 150 35 25 35-10 60-50 55-35-5-60 20-95 5-40-17-45-75-5-95z"/>
    <path d="M680 380c35-10 80 5 90 40 10 40-20 90-60 95-35 5-55-35-50-70 2-30-5-58 20-65z"/>
    <path d="M880 340c45-12 110 10 120 55 8 38-35 55-70 70-40 18-80-5-85-45-4-35 5-70 35-80z"/>
  </g>
  <g fill="none" stroke="#FFFFFF" stroke-width="2" opacity="0.6" clip-path="url(#globeClip)">
    <ellipse cx="800" cy="330" rx="230" ry="80"/>
    <ellipse cx="800" cy="330" rx="110" ry="230"/>
    <line x1="570" y1="330" x2="1030" y2="330"/>
  </g>

  <!-- flight arcs -->
  <g fill="none" stroke="#1B3139" stroke-width="3" stroke-dasharray="2 12" stroke-linecap="round" opacity="0.45">
    <path d="M660 250 Q760 120 900 200"/>
    <path d="M900 200 Q1000 300 930 420"/>
    <path d="M700 430 Q800 520 930 420"/>
  </g>

  <!-- pins -->
  <g>
    <g transform="translate(660 250)"><path d="M0 0c-16-22-26-34-26-48a26 26 0 0 1 52 0c0 14-10 26-26 48z" fill="#FF3621"/><circle cx="0" cy="-48" r="10" fill="#FFFFFF"/></g>
    <g transform="translate(900 200)"><path d="M0 0c-16-22-26-34-26-48a26 26 0 0 1 52 0c0 14-10 26-26 48z" fill="#00A972"/><circle cx="0" cy="-48" r="10" fill="#FFFFFF"/></g>
    <g transform="translate(930 420)"><path d="M0 0c-16-22-26-34-26-48a26 26 0 0 1 52 0c0 14-10 26-26 48z" fill="#FF3621"/><circle cx="0" cy="-48" r="10" fill="#FFFFFF"/></g>
    <g transform="translate(700 430)"><path d="M0 0c-16-22-26-34-26-48a26 26 0 0 1 52 0c0 14-10 26-26 48z" fill="#1B3139"/><circle cx="0" cy="-48" r="10" fill="#FFFFFF"/></g>
  </g>

  <!-- booking card (center, overlapping globe bottom) -->
  <g filter="url(#sh)">
    <rect x="640" y="470" width="320" height="170" rx="20" fill="#FFFFFF"/>
  </g>
  <rect x="640" y="470" width="320" height="44" rx="20" fill="#1B3139"/>
  <rect x="640" y="494" width="320" height="20" fill="#1B3139"/>
  <circle cx="666" cy="492" r="7" fill="#FF3621"/>
  <text x="684" y="498" font-size="17" font-weight="700" fill="#FFFFFF">Wanderbricks</text>
  <rect x="664" y="530" width="72" height="56" rx="10" fill="#FFDFBF"/>
  <path d="M678 572 l22-20 22 20 z" fill="#FF3621"/>
  <rect x="686" y="566" width="28" height="16" fill="#FFFFFF"/>
  <rect x="752" y="534" width="150" height="12" rx="6" fill="#1B3139" opacity="0.8"/>
  <rect x="752" y="556" width="110" height="10" rx="5" fill="#1B3139" opacity="0.25"/>
  <rect x="752" y="574" width="80" height="10" rx="5" fill="#1B3139" opacity="0.25"/>
  <!-- status chips -->
  <g font-size="12" font-weight="700" text-anchor="middle">
    <rect x="660" y="600" width="64" height="24" rx="12" fill="#FFF3D6"/><text x="692" y="616" fill="#9A6A00">pending</text>
    <rect x="730" y="600" width="78" height="24" rx="12" fill="#D9F2E9"/><text x="769" y="616" fill="#00744E">confirmed</text>
    <rect x="814" y="600" width="82" height="24" rx="12" fill="#DDEBFA"/><text x="855" y="616" fill="#1F5A99">completed</text>
  </g>
  <g transform="translate(920 612)"><circle r="12" fill="#FFE1DB"/><path d="M-5 -5 L5 5 M5 -5 L-5 5" stroke="#FF3621" stroke-width="3" stroke-linecap="round"/></g>

  <!-- traveler (left) -->
  <g transform="translate(300 330)">
    <ellipse cx="0" cy="270" rx="120" ry="14" fill="#1B3139" opacity="0.08"/>
    <!-- suitcase -->
    <g filter="url(#sh)">
      <rect x="40" y="150" width="90" height="115" rx="16" fill="#FF3621"/>
    </g>
    <rect x="68" y="130" width="34" height="24" rx="8" fill="none" stroke="#1B3139" stroke-width="6"/>
    <rect x="58" y="175" width="12" height="70" rx="6" fill="#FFFFFF" opacity="0.5"/>
    <rect x="100" y="175" width="12" height="70" rx="6" fill="#FFFFFF" opacity="0.5"/>
    <circle cx="60" cy="270" r="7" fill="#1B3139"/><circle cx="110" cy="270" r="7" fill="#1B3139"/>
    <!-- body -->
    <rect x="-52" y="170" width="30" height="95" rx="14" fill="#1B3139"/>
    <rect x="-18" y="170" width="30" height="95" rx="14" fill="#1B3139"/>
    <path d="M-70 60 q50-28 100 0 v120 h-100z" fill="#00A972"/>
    <rect x="22" y="80" width="26" height="80" rx="13" fill="#00A972" transform="rotate(-25 35 85)"/>
    <circle cx="48" cy="150" r="13" fill="#F2C7A5"/>
    <rect x="-90" y="80" width="26" height="80" rx="13" fill="#00A972" transform="rotate(12 -77 85)"/>
    <!-- backpack strap -->
    <path d="M-50 62 L-10 175" stroke="#1B3139" stroke-width="8" stroke-linecap="round" opacity="0.7"/>
    <!-- head -->
    <circle cx="-20" cy="20" r="38" fill="#F2C7A5"/>
    <path d="M-60 12 q40-60 82-6 q-36-6-82 6z" fill="#1B3139"/>
    <rect x="-66" y="0" width="94" height="12" rx="6" fill="#FF3621"/>
  </g>

  <!-- host (right) -->
  <g transform="translate(1290 330)">
    <ellipse cx="-30" cy="270" rx="170" ry="14" fill="#1B3139" opacity="0.08"/>
    <!-- house -->
    <g filter="url(#sh)">
      <rect x="-200" y="120" width="150" height="145" rx="10" fill="#FFFFFF"/>
    </g>
    <path d="M-220 130 L-125 50 L-30 130 z" fill="#1B3139"/>
    <rect x="-145" y="190" width="40" height="75" rx="6" fill="#FF3621"/>
    <circle cx="-112" cy="230" r="4" fill="#FFFFFF"/>
    <rect x="-185" y="150" width="34" height="30" rx="5" fill="#B6E3F4"/>
    <rect x="-95" y="150" width="34" height="30" rx="5" fill="#B6E3F4"/>
    <!-- person -->
    <rect x="48" y="170" width="30" height="95" rx="14" fill="#1B3139"/>
    <rect x="82" y="170" width="30" height="95" rx="14" fill="#1B3139"/>
    <path d="M30 60 q50-28 100 0 v120 h-100z" fill="#C0AEDE"/>
    <rect x="132" y="80" width="26" height="80" rx="13" fill="#C0AEDE" transform="rotate(-12 145 85)"/>
    <rect x="10" y="70" width="26" height="70" rx="13" fill="#C0AEDE" transform="rotate(60 23 75)"/>
    <!-- key -->
    <g transform="translate(-8 52) rotate(-20)">
      <circle cx="0" cy="0" r="14" fill="none" stroke="#FFB300" stroke-width="7"/>
      <path d="M14 0 h34 M38 0 v10 M46 0 v8" stroke="#FFB300" stroke-width="7" stroke-linecap="round"/>
    </g>
    <circle cx="-12" cy="60" r="12" fill="#E8B48F"/>
    <!-- head -->
    <circle cx="80" cy="20" r="38" fill="#E8B48F"/>
    <path d="M40 22 q0-62 80-48 q12 28 0 46 q-10-28-40-30 q-24 6-40 32z" fill="#5A3A2E"/>
  </g>

  <!-- seasonality: sun & snowflake -->
  <g transform="translate(1110 120)">
    <circle r="30" fill="#FFB300"/>
    <g stroke="#FFB300" stroke-width="6" stroke-linecap="round">
      <line x1="0" y1="-48" x2="0" y2="-40"/><line x1="0" y1="40" x2="0" y2="48"/>
      <line x1="-48" y1="0" x2="-40" y2="0"/><line x1="40" y1="0" x2="48" y2="0"/>
      <line x1="-34" y1="-34" x2="-28" y2="-28"/><line x1="28" y1="28" x2="34" y2="34"/>
      <line x1="-34" y1="34" x2="-28" y2="28"/><line x1="28" y1="-28" x2="34" y2="-34"/>
    </g>
  </g>
  <g transform="translate(480 110)" stroke="#7CC4E4" stroke-width="5" stroke-linecap="round">
    <line x1="0" y1="-28" x2="0" y2="28"/>
    <line x1="-24" y1="-14" x2="24" y2="14"/>
    <line x1="-24" y1="14" x2="24" y2="-14"/>
    <path d="M-7 -21 L0 -14 L7 -21 M-7 21 L0 14 L7 21" fill="none"/>
  </g>
</svg>
